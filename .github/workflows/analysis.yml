name: Experiment Analysis Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python src/generate_experiment.py
      - run: pytest -q
      - run: python src/analyze_experiment.py
      - name: Verify analysis outputs
        run: |
          test -f analysis/variant_summary.csv
          test -f analysis/segment_results.csv
          test -f analysis/experiment_metrics.csv
          test -f analysis/conversion_rate.png
